<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your todolist password</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          td: {
            red: '#e44232',
            redhover: '#c93425',
            redsoft: '#ffefe5',
            text: '#202020',
            secondary: '#575757',
            muted: '#737373',
            cream: '#faf6f1',
            sand: '#f5efe6',
            border: '#e5e5e5',
            blue: '#246fe0',
            green: '#058527',
          }
        },
        fontFamily: {
          sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
        }
      }
    }
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.408.0/dist/umd/lucide.min.js"></script>

<style>
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #202020; background-color: #ffffff; }
  .auth-input-wrap:focus-within { border-color: #202020; box-shadow: 0 0 0 1px #202020; }
  .auth-input-wrap.error { border-color: #e44232; box-shadow: 0 0 0 1px #e44232; }
</style>
</head>
<body class="min-h-screen flex flex-col bg-white antialiased selection:bg-td-red/15 selection:text-td-red">

<header class="w-full max-w-6xl mx-auto px-6 sm:px-10 pt-7 pb-4 flex items-center justify-between">
  <a href="/" class="inline-flex items-center gap-2.5 focus:outline-none">
    <img src="/images/logo.png" alt="todolist" class="w-[30px] h-[30px] rounded-[7px] object-cover" />
    <span class="font-bold text-[22px] tracking-[-0.03em] text-td-red">todolist</span>
  </a>
  <a href="/" class="text-xs sm:text-sm font-medium text-td-secondary hover:text-td-text transition">← Back to home</a>
</header>

<main class="flex-1 w-full max-w-6xl mx-auto px-6 sm:px-10 py-8 sm:py-12 grid lg:grid-cols-12 gap-12 items-center">
  <div class="lg:col-span-5 w-full max-w-[400px] mx-auto lg:mx-0">
    <h1 class="text-[32px] font-extrabold tracking-[-0.025em] text-td-text mb-6">Forgot your password?</h1>

    <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium flex items-start gap-2"></div>

    <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3.5" novalidate>
      <div>
        <div id="email-wrap" class="auth-input-wrap border border-td-border rounded-lg px-3.5 py-2 transition bg-white">
          <label for="auth-email" class="block text-[11px] font-semibold text-td-text">Email</label>
          <input id="auth-email" type="email" required placeholder="Enter your personal or work email..." class="w-full text-sm text-td-text placeholder:text-gray-400 outline-none mt-0.5 bg-transparent" />
        </div>
        <p id="email-error" class="hidden mt-1 text-[11px] text-td-red font-medium">Please enter a valid email address.</p>
      </div>

      <button id="auth-submit-btn" type="submit" class="w-full h-11 bg-td-red hover:bg-td-redhover text-white font-bold text-[15px] rounded-lg transition active:scale-[0.99] mt-1">Reset my password</button>
    </form>

    <div class="mt-6 pt-5 border-t border-gray-200 text-center text-[13px] text-td-text">
      <span>Remembered your password?</span>
      <a href="/login.html" class="font-semibold underline hover:text-td-red transition ml-1">Go to login</a>
    </div>
  </div>

  <div class="hidden lg:flex lg:col-span-7 flex-col items-center justify-center pl-8">
    <div class="w-full max-w-lg bg-td-cream border border-[#ebe5dc] rounded-[28px] p-10 relative overflow-hidden">
      <p class="text-[15px] font-semibold text-td-text">Enter your email and we’ll send you a link to reset your password.</p>
    </div>
  </div>
</main>

<script>
  async function handleAuthSubmit(e) {
    e.preventDefault();
    clearErrors();

    const email = document.getElementById('auth-email').value.trim();
    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    if (!emailValid) {
      document.getElementById('email-wrap').classList.add('error');
      document.getElementById('email-error').classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('auth-submit-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showAlert(data.error || 'Unable to process request.', false);
        return;
      }
      showAlert(data.message || 'If an account with that email exists, a password reset link has been sent.', true);
    } catch (err) {
      showAlert('Unable to reach the server. Please try again.', false);
    } finally {
      btn.disabled = false;
    }
  }

  function clearErrors() {
    document.getElementById('auth-alert').classList.add('hidden');
    document.getElementById('email-wrap').classList.remove('error');
    document.getElementById('email-error').classList.add('hidden');
  }

  function showAlert(message, isSuccess = false) {
    const alertBox = document.getElementById('auth-alert');
    alertBox.className = `mb-4 p-3 rounded-lg text-xs font-medium flex items-start gap-2 ${isSuccess ? 'bg-green-50 text-td-green border border-green-200' : 'bg-red-50 text-td-red border border-red-200'}`;
    alertBox.innerHTML = `<span>${message}</span>`;
    alertBox.classList.remove('hidden');
  }

  lucide.createIcons();
</script>
</body>
</html>
