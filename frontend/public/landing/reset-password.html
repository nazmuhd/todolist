<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set a new password - todolist</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { td: { red:'#e44232', redhover:'#c93425', text:'#202020', secondary:'#575757', border:'#e5e5e5', green:'#058527' } }, fontFamily: { sans:['Inter','-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','Helvetica','Arial','sans-serif'] } } } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#202020}.auth-input-wrap:focus-within{border-color:#202020;box-shadow:0 0 0 1px #202020}.auth-input-wrap.error{border-color:#e44232;box-shadow:0 0 0 1px #e44232}</style>
</head>
<body class="min-h-screen flex flex-col bg-white">
<header class="w-full max-w-6xl mx-auto px-6 sm:px-10 pt-7 pb-4 flex items-center justify-between">
  <a href="/" class="inline-flex items-center gap-2.5"><img src="/images/logo.png" alt="todolist" class="w-[30px] h-[30px] rounded-[7px] object-cover" /><span class="font-bold text-[22px] tracking-[-0.03em] text-td-red">todolist</span></a>
  <a href="/login.html" class="text-xs sm:text-sm font-medium text-td-secondary hover:text-td-text transition">Back to login</a>
</header>
<main class="flex-1 w-full max-w-md mx-auto px-6 py-12">
  <h1 class="text-[32px] font-extrabold tracking-[-0.025em] text-td-text mb-6">Reset password</h1>
  <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>
  <form id="reset-form" onsubmit="handleReset(event)" class="space-y-3.5" novalidate>
    <div>
      <div id="email-wrap" class="auth-input-wrap border border-td-border rounded-lg px-3.5 py-2 bg-white">
        <label for="email" class="block text-[11px] font-semibold text-td-text">Email</label>
        <input id="email" type="email" required class="w-full text-sm text-td-text outline-none mt-0.5 bg-transparent" />
      </div>
    </div>
    <div>
      <div id="password-wrap" class="auth-input-wrap border border-td-border rounded-lg px-3.5 py-2 bg-white">
        <label for="password" class="block text-[11px] font-semibold text-td-text">New password</label>
        <input id="password" type="password" required placeholder="At least 8 characters" class="w-full text-sm text-td-text outline-none mt-0.5 bg-transparent" />
      </div>
      <p id="password-error" class="hidden mt-1 text-[11px] text-td-red font-medium">Password must be at least 8 characters.</p>
    </div>
    <button id="submit-btn" type="submit" class="w-full h-11 bg-td-red hover:bg-td-redhover text-white font-bold text-[15px] rounded-lg transition">Set new password</button>
  </form>
</main>
<script>
  const params = new URLSearchParams(location.search);
  document.getElementById('email').value = params.get('email') || '';
  const token = params.get('token') || '';

  function showAlert(message, isSuccess=false){
    const el=document.getElementById('auth-alert');
    el.className=`mb-4 p-3 rounded-lg text-xs font-medium ${isSuccess?'bg-green-50 text-td-green border border-green-200':'bg-red-50 text-td-red border border-red-200'}`;
    el.textContent=message; el.classList.remove('hidden');
  }

  async function handleReset(e){
    e.preventDefault();
    document.getElementById('auth-alert').classList.add('hidden');
    document.getElementById('password-error').classList.add('hidden');
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    if(!token || !email){ showAlert('Missing reset token or email. Please use the link from your email.'); return; }
    if(password.length<8){ document.getElementById('password-error').classList.remove('hidden'); return; }
    const btn=document.getElementById('submit-btn'); btn.disabled=true;
    try{
      const res=await fetch('/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({token,email,password})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok){ showAlert(data.error||'Unable to reset password.'); return; }
      showAlert(data.message||'Password reset successfully. You can now log in.', true);
      setTimeout(()=>location.href='/login.html',1200);
    }catch(err){ showAlert('Unable to reach the server. Please try again.'); }
    finally{ btn.disabled=false; }
  }
</script>
</body>
</html>
