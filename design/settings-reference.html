<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help & Resources Menu</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          td: {
            darkBg: '#1e1e1e',       // Main menu background
            darkBorder: '#333333',   // Dividers
            darkHover: '#2d2d2d',    // Hover state
            darkText: '#f5f5f5',     // Main text
            darkMuted: '#a3a3a3',    // Muted text/icons
          }
        },
        fontFamily: {
          sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
        }
      }
    }
  }
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.408.0/dist/umd/lucide.min.js"></script>

<style>
  /* Custom scrollbar for the menu */
  .scrollbar-thin::-webkit-scrollbar { width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  
  /* Smooth entry animation */
  .menu-enter { animation: slideUp 0.15s ease-out forwards; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body class="bg-gray-100 h-screen flex items-end justify-start p-8 font-sans">

<!-- Wrapper for positioning -->
<div class="relative w-[300px]">
  
  <!-- ================= UPWARD DROPDOWN MENU ================= -->
  <!-- Note: 'bottom-full' pushes it up. 'mb-2' adds a gap. -->
  <div id="help-menu" class="hidden absolute bottom-full left-0 mb-2 w-full bg-td-darkBg border border-td-darkBorder rounded-xl shadow-2xl overflow-hidden text-sm text-td-darkText z-50 menu-enter">
    
    <!-- Section 1: Help -->
    <div class="py-1.5 border-b border-td-darkBorder">
      <a href="#" class="flex items-center justify-between px-3 py-2 hover:bg-td-darkHover transition-colors group">
        <div class="flex items-center gap-3">
          <i data-lucide="help-circle" class="w-4 h-4 text-td-darkMuted"></i>
          <span>Help center</span>
        </div>
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-td-darkMuted group-hover:text-td-darkText"></i>
      </a>
      
      <a href="#" class="flex items-center justify-between px-3 py-2 hover:bg-td-darkHover transition-colors group">
        <div class="flex items-center gap-3">
          <i data-lucide="graduation-cap" class="w-4 h-4 text-td-darkMuted"></i>
          <span>Getting started guide</span>
        </div>
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-td-darkMuted group-hover:text-td-darkText"></i>
      </a>
      
      <a href="#" class="flex items-center justify-between px-3 py-2 hover:bg-td-darkHover transition-colors group">
        <div class="flex items-center gap-3">
          <i data-lucide="lightbulb" class="w-4 h-4 text-td-darkMuted"></i>
          <span>Inspiration hub</span>
        </div>
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-td-darkMuted group-hover:text-td-darkText"></i>
      </a>
      
      <a href="#" class="flex items-center justify-between px-3 py-2 hover:bg-td-darkHover transition-colors group">
        <div class="flex items-center gap-3">
          <i data-lucide="play" class="w-4 h-4 text-td-darkMuted"></i>
          <span>YouTube videos</span>
        </div>
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-td-darkMuted group-hover:text-td-darkText"></i>
      </a>
      
      <a href="#" class="flex items-center justify-between px-3 py-2 hover:bg-td-darkHover transition-colors group">
        <div class="flex items-center gap-3">
          <i data-lucide="mail" class="w-4 h-4 text-td-darkMuted"></i>
          <span>Newsletter</span>
        </div>
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-td-darkMuted group-hover:text-td-darkText"></i>
      </a>
    </div>

    <!-- Section 2: Tools -->
    <div class="py-1.5 border-b border-td-darkBorder">
      <a href="#" class="flex items-center justify-between px-3 py-2 hover:bg-td-darkHover transition-colors group">
        <div class="flex items-center gap-3">
          <i data-lucide="diamond" class="w-4 h-4 text-td-darkMuted"></i>
          <span>Browse templates</span>
        </div>
      </a>
      
      <a href="#" class="flex items-center justify-between px-3 py-2 hover:bg-td-darkHover transition-colors group">
        <div class="flex items-center gap-3">
          <i data-lucide="puzzle" class="w-4 h-4 text-td-darkMuted"></i>
          <span>Add integrations</span>
        </div>
      </a>
      
      <a href="#" class="flex items-center justify-between px-3 py-2 hover:bg-td-darkHover transition-colors group">
        <div class="flex items-center gap-3">
          <i data-lucide="keyboard" class="w-4 h-4 text-td-darkMuted"></i>
          <span>Keyboard shortcuts</span>
        </div>
        <span class="text-xs text-td-darkMuted border border-td-darkMuted rounded px-1.5 py-0.5 group-hover:text-td-darkText group-hover:border-td-darkText">?</span>
      </a>
    </div>

    <!-- Section 3: Apps -->
    <div class="py-1.5">
      <a href="#" class="flex items-center justify-between px-3 py-2 hover:bg-td-darkHover transition-colors group">
        <div class="flex items-center gap-3">
          <i data-lucide="smartphone" class="w-4 h-4 text-td-darkMuted"></i>
          <span>Download apps</span>
        </div>
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-td-darkMuted group-hover:text-td-darkText"></i>
      </a>
    </div>

  </div>

  <!-- ================= TRIGGER BUTTON ================= -->
  <button id="help-btn" class="w-full flex items-center gap-3 px-4 py-2.5 bg-gray-200 hover:bg-gray-300 rounded-lg text-gray-700 font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-gray-400">
    <i data-lucide="help-circle" class="w-5 h-5"></i>
    <span>Help & resources</span>
  </button>

</div>

<script>
  // Initialize icons
  lucide.createIcons();

  const helpBtn = document.getElementById('help-btn');
  const helpMenu = document.getElementById('help-menu');

  // Toggle menu on button click
  helpBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // Prevent click from bubbling to document
    
    const isHidden = helpMenu.classList.contains('hidden');
    
    if (isHidden) {
      // Show menu and restart animation
      helpMenu.classList.remove('hidden');
      helpMenu.classList.remove('menu-enter');
      void helpMenu.offsetWidth; // Force reflow to restart animation
      helpMenu.classList.add('menu-enter');
    } else {
      // Hide menu
      helpMenu.classList.add('hidden');
    }
  });

  // Close menu when clicking outside
  document.addEventListener('click', (e) => {
    if (!helpMenu.contains(e.target) && !helpBtn.contains(e.target)) {
      helpMenu.classList.add('hidden');
    }
  });

  // Close menu on Escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      helpMenu.classList.add('hidden');
    }
  });
</script>

</body>
</html>
